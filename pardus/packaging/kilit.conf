# Okul paketi bu dosyayı /etc/etakit/kilit.conf olarak kurar.
# server_url boşsa tahta ilk açılışta ayar penceresi gösterir.
# Adres, tahtanın eriştiği paneldir. Sonda / olmasın.
# enrollment_key, web sunucusundaki BOARD_ENROLLMENT_KEY ile aynı olmalı.

# emergency_pin_hash, paket üretilirken --emergency-pin ile yazılır.
# Acil açılış beş dakika sürer, sonra kilit geri gelir.

server_url=
enrollment_key=
idle_seconds=600
lock_countdown_seconds=10
offline_grace_seconds=45
heartbeat_seconds=10
command_wait_seconds=20
tls_verify=yes
state_dir=/var/lib/etakit
emergency_seconds=300
emergency_max_attempts=5
emergency_lockout_seconds=300
